<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>One-Year Activity Graph – Serializd Theme</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--  Web-component  -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@hsablonniere/activity-graph/+esm"></script>
    <!--  parser  -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

    <style>
        :root {
            --bg: #101214;
            --fg: #f4f4f4;
            --accent: #0d9488;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, system-ui
        }

        body {
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            align-items: center
        }

        h1 {
            margin: .6rem 0;
            font-size: 1.5rem
        }

        /* fixed toolbar (always visible) */
        #toolbar {
            display: flex;
            gap: .75rem;
            align-items: center;
            margin: .5rem 0 1rem 0;
        }

        button,
        input,
        select {
            padding: .45rem .7rem;
            background: var(--bg);
            color: var(--fg);
            border: 2px solid var(--fg);
            cursor: pointer;
            border-radius: 3px
        }

        button:hover {
            background: var(--accent);
            color: #000
        }

        /* year-graph */
        #graphWrap {
            max-width: 88vw;
            overflow-x: auto;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .45);
            border-radius: 6px;
        }

        /* ---------- SERIALIZD THEME ---------- */
        activity-graph.serializd {
            --size: 14px;
            background: #0d0f12;
            color: #f4f4f4;
            display: inline-grid;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial;
            gap: 1px;
            padding: 1rem;
        }

        activity-graph.serializd::part(weekday-header),
        activity-graph.serializd::part(month-header) {
            font-size: 11px
        }

        activity-graph.serializd::part(weekday-header),
        activity-graph.serializd::part(day) {
            height: var(--size);
            line-height: var(--size)
        }

        activity-graph.serializd::part(day) {
            width: var(--size);
            background: #181c20;
            transition: transform .12s ease, box-shadow .12s ease
        }

        activity-graph.serializd::part(day):hover {
            transform: scale(1.25);
            background: #0d9488;
            z-index: 2
        }

        activity-graph.serializd::part(day selected) {
            box-shadow: 0 0 6px 2px #0d9488;
            /* background: inherit;  -- REMOVED THIS LINE */
            outline: 2px solid #0d9488;
            border-radius: 2px;
            z-index: 5;
        }

        activity-graph.serializd::part(day--data-1) {
            background: rgba(13, 148, 136, .4)
        }

        activity-graph.serializd::part(day--data-2) {
            background: rgba(13, 148, 136, .5)
        }

        activity-graph.serializd::part(day--data-3) {
            background: rgba(13, 148, 136, .6)
        }

        activity-graph.serializd::part(day--data-4) {
            background: rgba(13, 148, 136, .7)
        }

        activity-graph.serializd::part(day--data-5) {
            background: rgba(13, 148, 136, .85)
        }

        activity-graph.serializd::part(day--data-6) {
            background: #0d9488
        }

        /* side panel (always open) */
        #sidePanel {
            margin-top: 1rem;
            background: #15171a;
            border: 1px solid #2a2f35;
            padding: .8rem 1rem;
            border-radius: 4px;
            min-width: 22rem;
            max-width: 88vw
        }

        label {
            font-size: .9rem
        }

        #toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            padding: .55rem 1rem;
            background: #0d9488;
            color: #000;
            border-radius: 4px;
            font-size: .85rem;
            opacity: 0;
            transition: opacity .3s
        }

        #toast.show {
            opacity: 1
        }
    </style>
</head>

<body>
    <h1>2024–2025 yearly tracker</h1>

    <nav id="toolbar">
        <label for="graphSelect">Graph:</label>
        <select id="graphSelect">
            <option value="default">default</option>
        </select>
        <button id="renameBtn" title="Rename graph">✏️</button>
        <button id="dateSelectBtn" title="Jump to a specific month">📆</button>
    </nav>

    <div id="graphWrap">
        <activity-graph id="graph" class="serializd" start-date="2025-01-01" end-date="2025-12-31"
            weekday-headers="short" month-headers="short" month-limits="early"></activity-graph>
    </div>


    <section id="sidePanel">
        <label for="entryInput">What happened on <strong id="panelDay"></strong>?</label>
        <input id="entryInput" maxlength="128" placeholder="128 chars max…" type="text">
        <button id="addBtn">add</button>
        <button id="delBtn" style="display:none">delete all entries</button>
        <ul id="entryList" style="margin:.5rem 0;padding-left:1.2em;"></ul>
    </section>


    <div id="toast"></div>

    <script>
        /* ---------- tiny helpers ---------- */
        const $ = q => document.querySelector(q);
        const fmt = d => d.toISOString().slice(0, 10);
        const toast = msg => {
            const t = $('#toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        };

        /* ---------- file API ---------- */
        class FileSystemVFS {
            constructor() {
                this._rootPromise = null;
                this._initPromise = this._init();
            }

            async _init() {
                try {
                    if (!navigator.storage || !navigator.storage.getDirectory) {
                        throw new Error('File System Access API not supported - use Chrome browser');
                    }
                    
                    const root = await navigator.storage.getDirectory();
                    this._rootPromise = Promise.resolve(root);
                    
                    // Create data directory if it doesn't exist
                    try {
                        await root.getDirectoryHandle('data', { create: true });
                    } catch (e) {
                        // Directory already exists or create failed
                        console.log('Data directory setup:', e.message || 'OK');
                    }
                    
                    console.log('File System Access API initialized successfully');
                } catch (error) {
                    console.error('Failed to initialize File System Access API:', error);
                    toast('Storage initialization failed - using Chrome?');
                    throw error;
                }
            }

            async _getRoot() {
                await this._initPromise;
                return this._rootPromise;
            }

            async _readFile(handle) {
                const file = await handle.getFile();
                const contents = await file.text();
                try {
                    return jsyaml.load(contents) || {};
                } catch (e) {
                    console.warn(`Failed to parse YAML file ${handle.name}, using empty object`);
                    return {};
                }
            }

            async _writeFile(handle, data) {
                const yaml = jsyaml.dump(data, { 
                    defaultFlowStyle: false,
                    lineWidth: -1 
                });
                const writable = await handle.createWritable();
                await writable.write(yaml);
                await writable.close();
            }

            async fetch(filename) {
                try {
                    await this._initPromise;
                    const root = await this._getRoot();
                    
                    // Handle monthly files: YYYY-MM.data.yaml
                    if (filename.includes('-') && filename.endsWith('.data.yaml')) {
                        const dataDir = await root.getDirectoryHandle('data', { create: true });
                        try {
                            const fileHandle = await dataDir.getFileHandle(filename);
                            return this._readFile(fileHandle);
                        } catch (e) {
                            // File doesn't exist, return empty object
                            console.log(`File ${filename} not found, returning empty`);
                            return {};
                        }
                    }
                    
                    // Handle yearly files (for backward compatibility during migration)
                    if (filename.endsWith('.data.yaml')) {
                        try {
                            const fileHandle = await root.getFileHandle(filename);
                            return this._readFile(fileHandle);
                        } catch (e) {
                            console.log(`Yearly file ${filename} not found, returning empty`);
                            return {};
                        }
                    }
                    
                    return {};
                } catch (error) {
                    console.error(`Error fetching ${filename}:`, error);
                    return {};
                }
            }

            async save(filename, data) {
                try {
                    await this._initPromise;
                    const root = await this._getRoot();
                    
                    // Handle monthly files: YYYY-MM.data.yaml
                    if (filename.includes('-') && filename.endsWith('.data.yaml')) {
                        const dataDir = await root.getDirectoryHandle('data', { create: true });
                        const fileHandle = await dataDir.getFileHandle(filename, { create: true });
                        await this._writeFile(fileHandle, data);
                        console.log(`Saved monthly file: ${filename}`);
                        return;
                    }
                    
                    // Handle yearly files (for backward compatibility)
                    if (filename.endsWith('.data.yaml')) {
                        const fileHandle = await root.getFileHandle(filename, { create: true });
                        await this._writeFile(fileHandle, data);
                        console.log(`Saved yearly file: ${filename}`);
                        return;
                    }
                    
                    throw new Error(`Unsupported file type: ${filename}`);
                } catch (error) {
                    console.error(`Error saving ${filename}:`, error);
                    toast(`Failed to save ${filename}`);
                    throw error;
                }
            }
        }
        const fs = new FileSystemVFS();

        let curBoard = 'default';
        let curSelected = fmt(new Date());
        let graph = $('#graph'); // Get graph element reference once

        /* ---------- year render ---------- */
        async function renderYear() {
            const yearFile = curSelected.slice(0, 4) + '.data.yaml';
            let db = await fs.fetch(yearFile);
            const boardObj = db[curBoard] || {};
            const data = {};
            for (const date in boardObj) {
                const n = boardObj[date].length;
                data[date] = {
                    parts: ['day--data-' + Math.min(n, 6)],
                    title: `${n} item${n !== 1 ? 's' : ''}`
                }
            }
            console.log("Data for graph:", data);
            graph.data = data;

            // highlight selected
            // This logic should ideally be handled within the graph component itself on data updates
            // or ensure the `selected` attribute correctly reflects `curSelected`.
            // For now, keep it, but be aware it's a manual override.
            graph.shadowRoot?.querySelector(`[data-date="${curSelected}"]`)?.setAttribute('part', 'day selected');
        }

        /* ---------- panel interactions ---------- */
        let prevSelectedCell = null; // Stays global for highlight management

        graph.addEventListener('click', e => {
            // Use composedPath() to get the actual element clicked, even within Shadow DOM
            const clickedElement = e.composedPath()[0];

            // Check if the clicked element has the data-date attribute
            if (!clickedElement?.dataset?.date) {
                console.log("Clicked but not a day cell (via composedPath)");
                return; // Not a day cell, exit
            }

            const newSelectedDate = clickedElement.dataset.date;

            // Remove highlight from previous cell if it exists and is different from the new one
            if (prevSelectedCell && prevSelectedCell !== clickedElement) {
                // Remove 'selected' part, restoring its original parts (including data-level)
                const currentParts = prevSelectedCell.getAttribute('part');
                const partsArray = currentParts ? currentParts.split(' ').filter(p => p !== 'selected').join(' ') : '';
                prevSelectedCell.setAttribute('part', partsArray);
                console.log(`Removed highlight from previous cell: ${prevSelectedCell.dataset.date}. New parts: '${partsArray}'`);
            }

            curSelected = newSelectedDate;
            console.log("Updating curSelected to:", curSelected);
            showPanel(curSelected);

            // Store the newly selected cell for future clicks
            prevSelectedCell = clickedElement;

            // Explicitly set the 'selected' part on the clicked cell
            // This ensures the visual highlight and _adds_ 'selected' to any existing parts
            const currentParts = clickedElement.getAttribute('part');
            const partsToAdd = currentParts ? `${currentParts} selected` : 'day selected'; // Ensure 'day' part is always present
            console.log(`Highlighting clicked cell: ${clickedElement.dataset.date}. Setting parts to: '${partsToAdd}'`);
            clickedElement.setAttribute('part', partsToAdd);
        });


        function showPanel(date) {
            $('#panelDay').textContent = date;
            $('#sidePanel').style.display = 'block';
            refreshPanel(date);
        }

        async function refreshPanel(date) {
            const yrFile = date.slice(0, 4) + '.data.yaml';
            const db = await fs.fetch(yrFile);
            const list = (db[curBoard] || {})[date] || [];
            $('#entryList').innerHTML = list.map((e, i) => `<li>${e.description}</li>`).join('');
            // FIX: corrected the display value
            $('#delBtn').style.display = list.length ? 'inline-block' : 'none';
        }

        /* ---------- form events ---------- */
        $('#addBtn').onclick = async () => {
            const txt = $('#entryInput').value.trim();
            if (!txt || txt.length > 128) { toast('invalid'); return; }

            const yrFile = curSelected.slice(0, 4) + '.data.yaml';
            let db = await fs.fetch(yrFile);
            db[curBoard] = db[curBoard] || {};
            db[curBoard][curSelected] = db[curBoard][curSelected] || [];
            db[curBoard][curSelected].push({ description: txt });
            await fs.save(yrFile, db);
            $('#entryInput').value = '';
            refreshPanel(curSelected);
            renderYear(); // Re-render year graph to update activity intensity
            toast('added');
        };

        $('#delBtn').onclick = async () => {
            const yrFile = curSelected.slice(0, 4) + '.data.yaml';
            let db = await fs.fetch(yrFile);
            if (db[curBoard]) delete db[curBoard][curSelected];
            await fs.save(yrFile, db);
            refreshPanel(curSelected);
            renderYear(); // Re-render year graph to update activity intensity
            toast('deleted');
        };

        // Corrected placement for rename and graph select handlers
        $('#renameBtn').addEventListener('click', async () => {
            const newName = prompt('New graph name:', curBoard);
            if (!newName || newName === curBoard) return;
            const ym = curSelected.slice(0, 7); // Use curSelected consistently
            let yrFile = curSelected.slice(0, 4) + '.data.yaml'; // Always work with the year file
            let db = await fs.fetch(yrFile);

            db[newName] = db[curBoard] || {}; // Copy data from old board to new
            delete db[curBoard]; // Delete old board
            await fs.save(yrFile, db);

            curBoard = newName;
            refreshBoards(); // Update dropdown
            renderYear(); // Re-render graph
            toast('renamed');
        });

        $('#graphSelect').addEventListener('change', e => {
            curBoard = e.target.value;
            renderYear(); // Re-render graph for new board
            showPanel(curSelected); // Re-render panel for new board's data
        });

        // Input limit validation
        const entryInput = $('#entryInput');
        entryInput.addEventListener('input', () => {
            const bad = entryInput.value.length > 128;
            // You had $('#valMsg') but no such element in HTML. Let's assume you'd show this visually
            // For now, let's just use console.log or remove if not needed.
            // If you want a visual message, add <div id="valMsg" style="color:red; display:none;">Too long!</div>
            // below your input field.
            // For demonstration, commenting out:
            // $('#valMsg').style.visibility = bad ? 'visible' : 'hidden';
        });


        /* --------------- boards selector --------------- */
        async function refreshBoards() {
            const graphSelect = $('#graphSelect'); // Get graphSelect element reference

            try {
                // Fetch all unique board names from all year/month files in storage
                const currentYear = new Date().getFullYear();
                const allBoards = new Set();
                
                // Check for existing files by trying to fetch common patterns
                const filePatterns = [
                    `${currentYear}.data.yaml`,
                    `${currentYear - 1}.data.yaml`,
                    // Check a few recent months
                    ...Array.from({length: 12}, (_, i) => {
                        const year = currentYear;
                        const month = String(i + 1).padStart(2, '0');
                        return `${year}-${month}.data.yaml`;
                    })
                ];

                // Try to fetch each file and collect board names
                for (const filename of filePatterns) {
                    try {
                        const fileData = await fs.fetch(filename);
                        Object.keys(fileData).forEach(boardName => allBoards.add(boardName));
                    } catch (e) {
                        // File doesn't exist or can't be read, skip
                        continue;
                    }
                }

                graphSelect.innerHTML = ''; // Clear existing options
                const boardList = Array.from(allBoards);
                
                // Always ensure 'default' exists
                if (!boardList.includes('default')) {
                    boardList.unshift('default');
                }

                boardList.forEach(boardName => {
                    graphSelect.add(new Option(boardName, boardName));
                });

                // Select the current board
                const currentOption = [...graphSelect.options].find(o => o.value === curBoard);
                if (currentOption) {
                    currentOption.selected = true;
                } else if (graphSelect.options.length > 0) {
                    // If current board not found, select the first available
                    curBoard = graphSelect.options[0].value;
                    graphSelect.options[0].selected = true;
                } else {
                    // Fallback: ensure at least 'default' exists
                    graphSelect.add(new Option('default', 'default'));
                    curBoard = 'default';
                    graphSelect.options[0].selected = true;
                }
            } catch (error) {
                console.error('Error refreshing boards:', error);
                // Fallback: create at least the default option
                graphSelect.innerHTML = '';
                graphSelect.add(new Option('default', 'default'));
                curBoard = 'default';
                graphSelect.options[0].selected = true;
            }
        }



        /* --------------- debug helpers --------------- */
        async function debugFileSystem() {
            try {
                const root = await fs._getRoot();
                
                console.log('=== File System Debug ===');
                console.log('Root directory accessible:', !!root);
                
                const files = [];
                
                // Check root directory for yearly files
                try {
                    console.log('Checking root directory for yearly files...');
                    const rootEntries = await root.values();
                    for await (const entry of rootEntries) {
                        if (entry.name.endsWith('.data.yaml') && !entry.name.includes('-')) {
                            files.push(`root/${entry.name}`);
                            const data = await fs.fetch(entry.name);
                            console.log(`File: root/${entry.name}`, data);
                        }
                    }
                } catch (e) {
                    console.log('Root directory access error:', e.message);
                }
                
                // Check data directory for monthly files
                try {
                    console.log('Checking data directory for monthly files...');
                    const dataDir = await root.getDirectoryHandle('data');
                    console.log('Data directory accessible:', !!dataDir);
                    
                    const dataEntries = await dataDir.values();
                    for await (const entry of dataEntries) {
                        if (entry.name.endsWith('.data.yaml')) {
                            files.push(`data/${entry.name}`);
                            const data = await fs.fetch(entry.name);
                            console.log(`File: data/${entry.name}`, data);
                        }
                    }
                } catch (e) {
                    console.log('Data directory access error (may not exist yet):', e.message);
                }
                
                console.log('Total found files:', files.length, files);
                
                // Also test common file patterns
                console.log('Testing common file access...');
                const testFiles = ['2025.data.yaml', '2025-08.data.yaml', '2025-07.data.yaml'];
                for (const filename of testFiles) {
                    try {
                        const data = await fs.fetch(filename);
                        const keys = Object.keys(data);
                        if (keys.length > 0) {
                            console.log(`Access test PASSED for ${filename}:`, keys);
                        }
                    } catch (e) {
                        console.log(`Access test FAILED for ${filename}:`, e.message);
                    }
                }
                
            } catch (error) {
                console.error('Debug failed:', error);
            }
        }

        // Add debug button to toolbar
        setTimeout(() => {
            const debugBtn = document.createElement('button');
            debugBtn.textContent = '🔍';
            debugBtn.title = 'Debug filesystem';
            debugBtn.onclick = debugFileSystem;
            document.getElementById('toolbar').appendChild(debugBtn);
        }, 1000);

        /* --------------- bootstrap --------------- */
        (async () => {
            const today = fmt(new Date());
            curSelected = today; // Initialize curSelected
            const yearFile = curSelected.slice(0, 4) + '.data.yaml';

            // create year file if missing for the current year
            if (!await fs.fetch(yearFile)) {
                await fs.save(yearFile, { default: {} });
            }

            await refreshBoards(); // Populate graph selection dropdown
            showPanel(curSelected); // Display side panel for today
            renderYear(); // Render the graph for the current year and board

            // Highlight the initially selected day after graph has rendered
            // Using a short timeout to ensure shadow DOM is fully ready can sometimes help,
            // but direct access after await should be sufficient.
            const initialSelectedCell = graph.shadowRoot?.querySelector(`[data-date="${curSelected}"]`);
            if (initialSelectedCell) {
                initialSelectedCell.setAttribute('part', 'day selected');
                prevSelectedCell = initialSelectedCell; // Initialize prevSelectedCell
            }
        })();
    </script>

    <!-- ========== tool tips for everybody ========== -->
    <script>(() => { /* naive tooltip strategy */
            document.addEventListener('mouseover', e => {
                const tip = e.target.getAttribute('title');
                if (!tip) return;
                const span = document.createElement('span');
                span.className = 'toolTip';
                span.textContent = tip;
                span.style.position = 'absolute'; span.style.bottom = '2px'; span.style.left = '5px';
                span.style.fontSize = '0.7rem'; span.style.background = '#000'; span.style.color = '#fff'; span.style.padding = '2px 5px'; span.style.borderRadius = '3px'; span.style.zIndex = 99;
                e.target.append(span);
            }, { once: false, capture: false });
            document.addEventListener('mouseout', e => document.querySelectorAll('.toolTip').forEach(t => t.remove()));
        })();
    </script>

</body>

</html>
